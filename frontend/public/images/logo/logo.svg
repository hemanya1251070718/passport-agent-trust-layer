<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <!-- Shield Badge with Neon Cyan/Purple Glow -->
  <defs>
    <linearGradient id="passport-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(4, 4)">
    <!-- Hexagonal Shield -->
    <path d="M20 2L36 10V24C36 33 29 40 20 42C11 40 4 33 4 24V10L20 2Z" fill="#030712" stroke="url(#passport-grad)" stroke-width="2.5" />
    <!-- Inner Keyhole / Pass Emblem -->
    <circle cx="20" cy="18" r="5" fill="url(#passport-grad)" />
    <path d="M18 22H22L24 32H16L18 22Z" fill="url(#passport-grad)" />
    <!-- Cryptographic Check Dot -->
    <circle cx="29" cy="13" r="2.5" fill="#10b981" />
  </g>
  
  <!-- Wordmark "PASSPORT" -->
  <text x="54" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="1.5" fill="#ffffff">
    PASS<tspan fill="#06b6d4">PORT</tspan>
  </text>
  
  <!-- Subtitle "AGENT TRUST" -->
  <text x="175" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8" letter-spacing="1" fill="#8b5cf6">TRUST</text>
  <text x="175" y="33" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8" letter-spacing="1" fill="#06b6d4">LAYER</text>
</svg>
